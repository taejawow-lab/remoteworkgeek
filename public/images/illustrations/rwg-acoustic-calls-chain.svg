<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Video call audio chain diagram</title><desc id="desc">Five connected stages show how room noise becomes captured, processed, and heard by listeners.</desc><rect width="1200" height="675" fill="#f5fbff"/><text x="70" y="82" font-family="Arial" font-size="42" font-weight="700" fill="#20384d">The call-quality chain</text><g font-family="Arial" font-size="24" font-weight="700"><rect x="70" y="160" width="180" height="230" rx="26" fill="#ffe3c7" stroke="#20384d" stroke-width="4"/><text x="105" y="215" fill="#20384d">Noise</text><text x="98" y="248" fill="#20384d">sources</text><circle cx="160" cy="315" r="45" fill="#ef7b45" opacity=".75"/><path d="M126 315h68M160 281v68" stroke="#20384d" stroke-width="7"/><rect x="300" y="160" width="180" height="230" rx="26" fill="#d9edf7" stroke="#20384d" stroke-width="4"/><text x="344" y="215" fill="#20384d">Room</text><text x="322" y="248" fill="#20384d">response</text><path d="M345 330c20-85 72-85 92 0M337 292c28-48 92-48 108 0" fill="none" stroke="#2e758f" stroke-width="8"/><rect x="530" y="160" width="180" height="230" rx="26" fill="#e6f0d7" stroke="#20384d" stroke-width="4"/><text x="570" y="215" fill="#20384d">Mic</text><text x="552" y="248" fill="#20384d">capture</text><rect x="606" y="282" width="36" height="90" rx="18" fill="#20384d"/><circle cx="624" cy="266" r="24" fill="#20384d"/><rect x="760" y="160" width="180" height="230" rx="26" fill="#f2dbf0" stroke="#20384d" stroke-width="4"/><text x="799" y="215" fill="#20384d">App</text><text x="782" y="248" fill="#20384d">cleanup</text><path d="M809 326h84M809 292h84M809 360h84" stroke="#8e5aa0" stroke-width="12" stroke-linecap="round"/><rect x="990" y="160" width="180" height="230" rx="26" fill="#fff7bf" stroke="#20384d" stroke-width="4"/><text x="1026" y="215" fill="#20384d">Listener</text><text x="1037" y="248" fill="#20384d">clarity</text><path d="M1050 330c20 23 43 23 65 0" fill="none" stroke="#20384d" stroke-width="8" stroke-linecap="round"/><circle cx="1040" cy="300" r="8" fill="#20384d"/><circle cx="1123" cy="300" r="8" fill="#20384d"/></g><g stroke="#20384d" stroke-width="8" stroke-linecap="round" fill="none"><path d="M254 275h40"/><path d="M484 275h40"/><path d="M714 275h40"/><path d="M944 275h40"/></g><text x="112" y="500" font-family="Arial" font-size="30" fill="#20384d">Fix earlier links first: quieter room + closer mic means less software damage.</text></svg>