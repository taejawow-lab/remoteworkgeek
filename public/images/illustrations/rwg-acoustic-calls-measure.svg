<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Acoustic measurement checklist</title><desc id="desc">A checklist for silent room, voice, typing, clap echo, and door or window noise tests.</desc><rect width="1200" height="675" fill="#fffaf2"/><rect x="110" y="70" width="980" height="535" rx="34" fill="#ffffff" stroke="#263d52" stroke-width="5"/><text x="160" y="135" font-family="Arial" font-size="42" font-weight="700" fill="#263d52">10-minute room baseline</text><g font-family="Arial" font-size="30" fill="#263d52"><g><circle cx="180" cy="215" r="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><path d="M168 215l9 10 18-22" fill="none" stroke="#2e758f" stroke-width="6"/><text x="230" y="225">Record 10 seconds of silence</text></g><g><circle cx="180" cy="295" r="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><path d="M168 295l9 10 18-22" fill="none" stroke="#2e758f" stroke-width="6"/><text x="230" y="305">Read one paragraph at meeting volume</text></g><g><circle cx="180" cy="375" r="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><path d="M168 375l9 10 18-22" fill="none" stroke="#2e758f" stroke-width="6"/><text x="230" y="385">Type while speaking to expose keyboard noise</text></g><g><circle cx="180" cy="455" r="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><path d="M168 455l9 10 18-22" fill="none" stroke="#2e758f" stroke-width="6"/><text x="230" y="465">Clap once and listen for flutter echo</text></g><g><circle cx="180" cy="535" r="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><path d="M168 535l9 10 18-22" fill="none" stroke="#2e758f" stroke-width="6"/><text x="230" y="545">Open and close likely noise leak paths</text></g></g><rect x="775" y="190" width="240" height="330" rx="28" fill="#ffe3c7" stroke="#263d52" stroke-width="4"/><path d="M850 415h90M895 245v170" stroke="#263d52" stroke-width="12" stroke-linecap="round"/><circle cx="895" cy="230" r="38" fill="#ef7b45"/><path d="M828 300c42-35 92-35 134 0M817 350c52-45 105-45 157 0" fill="none" stroke="#2e758f" stroke-width="8" stroke-linecap="round"/><text x="806" y="568" font-family="Arial" font-size="24" font-weight="700" fill="#263d52">Save before/after samples</text></svg>