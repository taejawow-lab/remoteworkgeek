<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Microphone choice matrix for remote work acoustics</title><desc id="desc">A four-quadrant matrix compares headset, dynamic microphone, condenser microphone, and earbuds by room noise and room treatment.</desc><rect width="1200" height="675" fill="#f5fbff"/><text x="90" y="85" font-family="Arial" font-size="42" font-weight="700" fill="#20384d">Choose capture by room behavior</text><line x1="600" y1="135" x2="600" y2="580" stroke="#20384d" stroke-width="5"/><line x1="150" y1="360" x2="1050" y2="360" stroke="#20384d" stroke-width="5"/><text x="180" y="130" font-family="Arial" font-size="24" fill="#20384d">Noisy room</text><text x="865" y="130" font-family="Arial" font-size="24" fill="#20384d">Quiet room</text><text x="55" y="325" font-family="Arial" font-size="24" fill="#20384d" transform="rotate(-90 55 325)">Untreated</text><text x="55" y="535" font-family="Arial" font-size="24" fill="#20384d" transform="rotate(-90 55 535)">Treated</text><g font-family="Arial" fill="#20384d" font-weight="700"><rect x="185" y="170" width="330" height="145" rx="24" fill="#ffe3c7" stroke="#20384d" stroke-width="4"/><text x="225" y="225" font-size="32">Boom headset</text><text x="225" y="265" font-size="22">Best for chaos</text><path d="M430 235c-20-40-80-40-100 0" fill="none" stroke="#ef7b45" stroke-width="8"/><rect x="685" y="170" width="330" height="145" rx="24" fill="#e6f0d7" stroke="#20384d" stroke-width="4"/><text x="725" y="225" font-size="32">Dynamic mic</text><text x="725" y="265" font-size="22">Close, controlled voice</text><rect x="865" y="220" width="26" height="62" rx="13" fill="#20384d"/><circle cx="878" cy="207" r="18" fill="#20384d"/><rect x="185" y="410" width="330" height="145" rx="24" fill="#d9edf7" stroke="#20384d" stroke-width="4"/><text x="225" y="465" font-size="32">Wired earbuds</text><text x="225" y="505" font-size="22">Travel fallback</text><path d="M420 460c-35-15-65 20-35 48" fill="none" stroke="#2e758f" stroke-width="8"/><rect x="685" y="410" width="330" height="145" rx="24" fill="#f2dbf0" stroke="#20384d" stroke-width="4"/><text x="725" y="465" font-size="32">Condenser mic</text><text x="725" y="505" font-size="22">Only when room is calm</text><circle cx="885" cy="478" r="28" fill="#8e5aa0"/></g></svg>