<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">45-minute home office acoustic reset flow</title><desc id="desc">A step-by-step flow from baseline recording through noise removal, mic placement, soft surfaces, and app testing.</desc><rect width="1200" height="675" fill="#fffaf2"/><text x="80" y="80" font-family="Arial" font-size="42" font-weight="700" fill="#263d52">45-minute acoustic reset</text><g font-family="Arial" font-weight="700" fill="#263d52"><rect x="80" y="160" width="190" height="210" rx="26" fill="#d9edf7" stroke="#263d52" stroke-width="4"/><text x="118" y="220" font-size="28">0-5</text><text x="112" y="260" font-size="24">Record</text><text x="105" y="292" font-size="24">baseline</text><rect x="310" y="160" width="190" height="210" rx="26" fill="#ffe3c7" stroke="#263d52" stroke-width="4"/><text x="342" y="220" font-size="28">5-15</text><text x="345" y="260" font-size="24">Remove</text><text x="344" y="292" font-size="24">noise</text><rect x="540" y="160" width="190" height="210" rx="26" fill="#e6f0d7" stroke="#263d52" stroke-width="4"/><text x="568" y="220" font-size="28">15-25</text><text x="575" y="260" font-size="24">Shorten</text><text x="590" y="292" font-size="24">mic path</text><rect x="770" y="160" width="190" height="210" rx="26" fill="#f2dbf0" stroke="#263d52" stroke-width="4"/><text x="798" y="220" font-size="28">25-35</text><text x="812" y="260" font-size="24">Add soft</text><text x="817" y="292" font-size="24">surfaces</text><rect x="1000" y="160" width="150" height="210" rx="26" fill="#fff7bf" stroke="#263d52" stroke-width="4"/><text x="1017" y="220" font-size="28">35-45</text><text x="1030" y="260" font-size="24">Test</text><text x="1025" y="292" font-size="24">apps</text></g><g stroke="#263d52" stroke-width="8" stroke-linecap="round" fill="none"><path d="M274 265h30"/><path d="M504 265h30"/><path d="M734 265h30"/><path d="M964 265h30"/></g><path d="M155 482h890" stroke="#263d52" stroke-width="6" stroke-linecap="round"/><g fill="#ef7b45"><circle cx="175" cy="482" r="16"/><circle cx="405" cy="482" r="16"/><circle cx="635" cy="482" r="16"/><circle cx="865" cy="482" r="16"/><circle cx="1075" cy="482" r="16"/></g><text x="138" y="545" font-family="Arial" font-size="28" fill="#263d52">Compare before and after recordings before buying anything.</text></svg>